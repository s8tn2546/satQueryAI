<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="globeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8FC5FF" />
      <stop offset="60%" stop-color="#4B96F3" />
      <stop offset="100%" stop-color="#1E448A" />
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FC5FF" />
      <stop offset="100%" stop-color="#3B7DDD" />
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <!-- Back Orbit Ring Arc (Behind Globe) -->
    <path d="M 100 210 A 185 64 -22 0 1 412 240" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.45" />

    <!-- Globe Sphere Base -->
    <circle cx="256" cy="240" r="110" fill="url(#globeGrad)" />

    <!-- Lat/Lon Curvature Overlay Lines -->
    <path d="M 146 240 A 110 110 0 0 0 366 240" fill="none" stroke="#E8ECF1" stroke-width="1.8" opacity="0.3" />
    <path d="M 166 188 A 110 60 0 0 0 346 188" fill="none" stroke="#E8ECF1" stroke-width="1.5" opacity="0.25" />
    <path d="M 166 292 A 110 60 0 0 0 346 292" fill="none" stroke="#E8ECF1" stroke-width="1.5" opacity="0.25" />
    <path d="M 256 130 A 110 110 0 0 1 256 350" fill="none" stroke="#E8ECF1" stroke-width="1.8" opacity="0.3" />

    <!-- Abstract Landmass Shapes -->
    <path d="M 195 180 Q 218 165 240 182 T 262 200 Q 232 215 202 195 Z" fill="#8FC5FF" opacity="0.75" />
    <path d="M 225 232 Q 255 225 277 248 T 262 292 Q 232 285 217 255 Z" fill="#6EB4FF" opacity="0.7" />
    <path d="M 292 188 Q 330 180 345 210 T 315 232 Q 292 218 292 188 Z" fill="#8FC5FF" opacity="0.7" />

    <!-- Front Orbit Ring Arc (In Front of Globe) -->
    <path d="M 412 240 A 185 64 -22 0 1 100 210" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Small satellite spark dot on the orbit ring -->
    <circle cx="395" cy="254" r="6" fill="#E8ECF1" />
  </g>
</svg>
